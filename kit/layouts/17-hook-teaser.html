<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Teaser cover</title>
<!-- Teaser cover: a close-up dark photo, a ruled kicker, a heavy italic all-caps headline with the second line in mint
     (*like this*), and an italic teaser line in brackets under it (sub). Optional: kicker, sub, swipe, handle and save, show_counter.
     Opens in the "noir-mint" look on assets/backgrounds/hook-closeup-dark.jpg. look, brand_colors and brand_fonts change that;
     background { src, tint } swaps the photo. Colours and fonts come from kit/hooks.css. -->
<script type="application/json" id="content">
{
  "slide": 1,
  "total": 8,
  "kicker": "Your brand",
  "headline": "5 tools devs\n*kept real quiet*",
  "sub": "(#3 is the best one...)"
}
</script>
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../hooks.css">
<style>
  .hook-ruled { font-style: italic; letter-spacing: .02em; font-size: calc(34px * var(--k)); }
  .hook-headline { --h-size: 104px; }
  .hook-copy { gap: calc(20px * var(--k)); }
  .hook-sub { font-style: italic; font-weight: 800; text-transform: uppercase; letter-spacing: -.01em; font-size: calc(38px * var(--k)); margin-top: calc(48px * var(--k)); }
</style>
</head>
<body>
<main class="slide hook t-teaser" data-bg="photo" data-no-chrome data-look="noir-mint">
  <div class="hook-photo" data-src="photo" data-decor role="img" aria-label="Background"></div>
  <div class="hook-tint" data-decor aria-hidden="true"></div>
  <div class="hook-fade" data-decor aria-hidden="true"></div>
  <span class="hook-count"></span>
  <section class="hook-stage">
    <div class="hook-copy" data-fit-box id="copy">
      <div class="hook-kicker hook-ruled" data-optional><span data-field="kicker"></span></div>
      <h1 class="hook-headline" data-field="headline" data-fit data-fit-grow="1.2"></h1>
      <p class="hook-sub" data-field="sub" data-fit></p>
      <span class="hook-button has-chevrons" data-field="swipe"></span>
    </div>
  </section>
  <footer class="hook-foot"><span class="handle" data-field="handle"></span><span class="save" data-field="save"></span></footer>
</main>
<script src="../hooks.js"></script>
<script src="../kit.js"></script>
</body></html>
