<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Scene cover</title>
<!-- Scene cover: an illustrated scene fills the slide, a big left-aligned headline sits in the clear sky at the top,
     the number or key word in the accent (*7*), a small grey subtitle under it. Optional: kicker, swipe, handle and save, show_counter.
     Opens in the "navy-orange" look on assets/backgrounds/hook-night-platform.jpg. look, brand_colors and brand_fonts change that;
     background { src, tint } swaps the photo. Colours and fonts come from kit/hooks.css. -->
<script type="application/json" id="content">
{
  "slide": 1,
  "total": 8,
  "headline": "*7* tools to add\nto your workflow",
  "sub": "Free, open source and quick to set up."
}
</script>
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../hooks.css">
<style>
  .slide.hook { --h-photo-pos: 50% 100%; }
  .hook-fade { background: linear-gradient(180deg, var(--h-bg) 0%, rgba(var(--h-bg-rgb), .92) 24%, rgba(var(--h-bg-rgb), .35) 46%, rgba(var(--h-bg-rgb), 0) 60%); }
  .hook-copy { justify-content: flex-start; align-items: flex-start; text-align: left; gap: calc(24px * var(--k)); padding-top: calc(30px * var(--k)); }
  .hook-headline { --h-size: 104px; }
  .hook-kicker { color: var(--h-accent); }
  .hook-button { margin-top: auto; }
</style>
</head>
<body>
<main class="slide hook t-scene" data-bg="photo" data-no-chrome data-look="navy-orange">
  <div class="hook-photo" data-src="photo" data-decor role="img" aria-label="Background"></div>
  <div class="hook-tint" data-decor aria-hidden="true"></div>
  <div class="hook-fade" data-decor aria-hidden="true"></div>
  <span class="hook-count"></span>
  <section class="hook-stage">
    <div class="hook-copy" data-fit-box id="copy">
      <p class="hook-kicker" data-field="kicker"></p>
      <h1 class="hook-headline" data-field="headline" data-fit data-fit-grow="1.3"></h1>
      <p class="hook-sub" data-field="sub" data-fit></p>
      <span class="hook-button has-chevrons" data-field="swipe"></span>
    </div>
  </section>
  <footer class="hook-foot"><span class="handle" data-field="handle"></span><span class="save" data-field="save"></span></footer>
</main>
<script src="../hooks.js"></script>
<script src="../kit.js"></script>
</body></html>
