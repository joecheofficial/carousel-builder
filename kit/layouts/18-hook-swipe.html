<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Swipe cover</title>
<!-- Swipe cover: a news-style night photo, a thin rule, a condensed all-caps headline with the first phrase in mint
     (*like this*), and an outlined swipe button with chevrons. Optional: kicker, sub, swipe, handle and save, show_counter.
     Opens in the "street-mint" look on assets/backgrounds/hook-press-night.jpg. look, brand_colors and brand_fonts change that;
     background { src, tint } swaps the photo. Colours and fonts come from kit/hooks.css. -->
<script type="application/json" id="content">
{
  "slide": 1,
  "total": 8,
  "headline": "*9 free tools* that replace apps you are paying for",
  "swipe": "Swipe"
}
</script>
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../hooks.css">
<style>
  .slide.hook { --h-photo-pos: 50% 45%; --h-pill-line: var(--h-accent); }
  .hook-headline { --h-size: 88px; }
  .hook-button { font-size: calc(50px * var(--k)); padding: calc(10px * var(--k)) calc(56px * var(--k)); }
  .hook-copy { gap: calc(22px * var(--k)); }
  .hook-rule { margin-bottom: calc(6px * var(--k)); }
  .hook-button { margin-top: calc(18px * var(--k)); }
</style>
</head>
<body>
<main class="slide hook t-swipe" data-bg="photo" data-no-chrome data-look="street-mint">
  <div class="hook-photo" data-src="photo" data-decor role="img" aria-label="Background"></div>
  <div class="hook-tint" data-decor aria-hidden="true"></div>
  <div class="hook-fade" data-decor aria-hidden="true"></div>
  <span class="hook-count"></span>
  <section class="hook-stage">
    <div class="hook-copy" data-fit-box id="copy">
      <p class="hook-kicker" data-field="kicker"></p>
      <div class="hook-rule" data-decor aria-hidden="true"></div>
      <h1 class="hook-headline" data-field="headline" data-fit data-fit-grow="1.3"></h1>
      <p class="hook-sub" data-field="sub" data-fit></p>
      <span class="hook-button has-chevrons" data-field="swipe"></span>
    </div>
  </section>
  <footer class="hook-foot"><span class="handle" data-field="handle"></span><span class="save" data-field="save"></span></footer>
</main>
<script src="../hooks.js"></script>
<script src="../kit.js"></script>
</body></html>
